name: Validate evidence ledger

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ledger:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate repository policy
        run: python3 verifier/validate_repository.py

      - name: Compile dependency-free tooling
        run: python3 -m compileall -q publisher verifier
